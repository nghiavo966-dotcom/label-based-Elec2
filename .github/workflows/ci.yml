
name: CI

# Events that trigger the workflow
on:
  # Run CI when code is pushed to main or development branches
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "test/**"
      - "ci/**"

  # Run CI when a Pull Request targets main
  pull_request:
    branches:
      - main

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

# Minimum permissions required by this workflow
permissions:
  contents: read

# Cancel outdated runs for the same branch or pull request
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Get the repository source code
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Step 3: Install development dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Step 4: Check Python code quality
      - name: Run Ruff Check
        run: ruff check .

      # Step 5: Check Python formatting
      - name: Check Ruff Formatting
        run: ruff format --check .

      # Step 6: Execute automated tests
      - name: Run Pytest
        run: pytest -v
